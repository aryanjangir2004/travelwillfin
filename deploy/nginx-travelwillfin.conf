server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name travelwithfinn.uk www.travelwithfinn.uk _;

    # Let's Encrypt cert, renewed by certbot.timer.
    ssl_certificate     /etc/letsencrypt/live/travelwithfinn.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/travelwithfinn.uk/privkey.pem;

    root /var/www/travelwillfin;
    index index.html;

    gzip on;
    gzip_types application/json application/javascript text/css;

    location / {
        try_files $uri $uri/ =404;
    }

    # Live data, written by the editor API.
    location = /data.json {
        alias /var/lib/finndex/data.json;
        add_header Cache-Control "no-cache";
    }

    # Editor page and save API: friends only (logins in /etc/nginx/finndex-editors).
    location /admin/ {
        auth_basic "Finndex editors";
        auth_basic_user_file /etc/nginx/finndex-editors;
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow";
        try_files $uri $uri/ =404;
    }

    location /api/ {
        auth_basic "Finndex editors";
        auth_basic_user_file /etc/nginx/finndex-editors;
        proxy_set_header X-Remote-User $remote_user;
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:8090;
        client_max_body_size 16k;
    }
}
