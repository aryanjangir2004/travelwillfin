<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Where Finn would travel to</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --text: #181818;
    --muted: #6b6b6b;
    --link: #1d81a2;
    --border: #d9d9d9;
    --nodata: #e6e6e6;
    --stroke: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font-family: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1280px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; font-weight: 700; margin: 0 0 6px; line-height: 1.2; }
  .sub { font-size: 14px; margin: 0 0 12px; line-height: 1.4; }
  .legend { width: 180px; margin-bottom: 4px; }
  .legend .bar { height: 12px; }
  .legend .ticks { display: flex; justify-content: space-between; font-size: 11px; margin-top: 2px; }
  .map { position: relative; width: 100%; }
  /* Pinches on the map zoom the map; one-finger drags scroll the page until it's zoomed in. */
  .map svg { display: block; width: 100%; height: auto; touch-action: pan-x pan-y; -webkit-tap-highlight-color: transparent; }
  .map.zoomed svg { touch-action: none; cursor: grab; }
  .country, .dot .mark { vector-effect: non-scaling-stroke; }
  /* Bottom-left sits over the South Pacific, where there's nothing to tap. */
  .zoom-controls { position: absolute; left: 8px; bottom: 8px; display: flex; gap: 6px; }
  .zoom-controls button {
    width: 34px; height: 34px; padding: 0; border-radius: 8px;
    border: 1px solid var(--border); background: #fff; color: var(--text);
    font: 500 20px/1 Roboto, system-ui, sans-serif; cursor: pointer;
    box-shadow: 0 1px 4px rgba(0,0,0,.1); touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .zoom-controls button:disabled { opacity: .4; cursor: default; }
  @media (max-width: 600px) {
    .zoom-controls { left: 4px; bottom: 4px; gap: 4px; }
    .zoom-controls button { width: 30px; height: 30px; font-size: 18px; }
  }
  .country { stroke: var(--stroke); stroke-width: 0.4; cursor: pointer; }
  .country.nodata { fill: var(--nodata); cursor: default; }
  .country.active { stroke: #181818; stroke-width: 1.2; }
  .dot { cursor: pointer; }
  .dot .hit { fill: transparent; }
  .dot .mark { stroke: var(--stroke); stroke-width: 0.8; }
  .dot.active .mark { stroke: #181818; stroke-width: 1.2; }
  .hint { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
  footer { font-size: 11px; color: var(--muted); margin-top: 12px; }
  footer a { color: var(--link); text-decoration: none; }
  .tip {
    /* Page coordinates + counter-scale, so it stays readable when the page is pinch-zoomed. */
    position: absolute; top: 0; left: 0; z-index: 10; pointer-events: none;
    transform-origin: 0 0;
    width: max-content; max-width: min(280px, calc(100vw - 16px)); padding: 10px 12px;
    background: #fff; border: 1px solid var(--border); border-radius: 4px;
    box-shadow: 0 2px 10px rgba(0,0,0,.12);
    font-size: 13px; line-height: 1.45;
    opacity: 0; transition: opacity .1s;
  }
  .tip.show { opacity: 1; }
  .tip .name { font-weight: 700; font-size: 14px; }
  .tip .score { display: flex; align-items: center; gap: 6px; margin: 2px 0 6px; color: var(--muted); }
  .tip .swatch { width: 10px; height: 10px; border-radius: 2px; }
  .tip .reason { color: var(--text); }
  .error { color: #b2182b; font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Where Finn would travel to</h1>
  <p class="sub">The Finndex shows the countries that Finn McCheechan would willingly visit</p>
  <div class="legend" aria-hidden="true">
    <div class="bar" id="legend-bar"></div>
    <div class="ticks"><span id="legend-min">0</span><span id="legend-max">98</span></div>
  </div>
  <div class="map" id="map"></div>
  <p class="hint">Hover over a country (or tap it on your phone) to see why. Pinch the map or use + to zoom in.</p>
  <footer>Source: Finn McCheechan</footer>
</main>
<div class="tip" id="tip" role="tooltip"></div>

<script src="vendor/d3.min.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script>
(async function () {
  const mapEl = document.getElementById("map");
  const tip = document.getElementById("tip");

  let world, data;
  try {
    [world, data] = await Promise.all([
      fetch("vendor/countries-50m.json").then(r => r.json()),
      fetch("data.json", { cache: "no-cache" }).then(r => r.json()),
    ]);
  } catch (e) {
    mapEl.innerHTML = '<p class="error">Could not load the map data.</p>';
    return;
  }

  const rows = Object.values(data);
  const min = d3.min(rows, d => d.score) ?? 0;
  const max = d3.max(rows, d => d.score) ?? 100;
  // Trim the darkest ends of RdBu so the extremes read like the Datawrapper original.
  const color = d3.scaleSequential(t => d3.interpolateRdBu(0.08 + t * 0.84)).domain([min, max]);

  document.getElementById("legend-min").textContent = min;
  document.getElementById("legend-max").textContent = max;
  const stops = d3.range(0, 1.01, 0.1).map(t => color(min + t * (max - min)));
  document.getElementById("legend-bar").style.background = `linear-gradient(to right, ${stops.join(",")})`;

  const features = topojson.feature(world, world.objects.countries).features
    .filter(f => f.properties.name !== "Antarctica");
  const rowFor = f => data[f.id] || data[f.properties.name];

  const width = 1000, height = 520;
  const projection = d3.geoNaturalEarth1()
    .fitExtent([[0, 0], [width, height]], { type: "FeatureCollection", features });
  const path = d3.geoPath(projection);

  const svg = d3.select(mapEl).append("svg")
    .attr("viewBox", `0 0 ${width} ${height}`)
    .attr("role", "img")
    .attr("aria-label", "World map coloured by Finndex score");

  let active = null, anchor = null, lastPointer = "mouse";

  // The visible part of the page, in page coordinates, plus the pinch-zoom level.
  function viewport() {
    const vv = window.visualViewport;
    return vv ? { x: vv.pageLeft, y: vv.pageTop, w: vv.width, h: vv.height, s: vv.scale }
              : { x: window.scrollX, y: window.scrollY, w: window.innerWidth, h: window.innerHeight, s: 1 };
  }

  function place(event) {
    if (event) anchor = { x: event.pageX, y: event.pageY };
    if (!anchor) return;
    const v = viewport();
    // Shrink by the zoom level so the box shows at normal size next to the finger.
    const k = 1 / v.s;
    tip.style.transform = `scale(${k})`;
    const w = tip.offsetWidth * k, h = tip.offsetHeight * k;
    const pad = 14 * k, edge = 8 * k;
    let x = anchor.x + pad, y = anchor.y + pad;
    if (x + w > v.x + v.w - edge) x = anchor.x - w - pad;
    if (y + h > v.y + v.h - edge) y = anchor.y - h - pad;
    x = Math.max(v.x + edge, Math.min(x, v.x + v.w - w - edge));
    y = Math.max(v.y + edge, y);
    tip.style.left = x + "px";
    tip.style.top = y + "px";
  }

  function show(event, f, node) {
    const d = rowFor(f);
    if (!d) return hide();
    tip.replaceChildren();
    const name = Object.assign(document.createElement("div"), { className: "name", textContent: d.country });
    const score = Object.assign(document.createElement("div"), { className: "score" });
    const sw = Object.assign(document.createElement("span"), { className: "swatch" });
    sw.style.background = color(d.score);
    score.append(sw, `Finndex: ${d.score}`);
    const reason = Object.assign(document.createElement("div"), { className: "reason", textContent: d.reason });
    tip.append(name, score, reason);
    tip.classList.add("show");
    place(event);
    if (active) active.classList.remove("active");
    active = node;
    node.classList.add("active");
    node.parentNode.appendChild(node); // bring outline to front
  }

  function hide() {
    tip.classList.remove("show");
    if (active) active.classList.remove("active");
    active = null;
  }

  function interactive(sel) {
    return sel
      .on("pointerenter", function (event, f) { if (event.pointerType === "mouse") show(event, f, this); })
      .on("pointermove", function (event) { if (event.pointerType === "mouse" && active === this) place(event); })
      .on("pointerleave", function (event) { if (event.pointerType === "mouse") hide(); })
      .on("click", function (event, f) {
        event.stopPropagation();
        if (active === this && lastPointer !== "mouse") return hide();
        show(event, f, this);
      });
  }

  const layer = svg.append("g");
  interactive(layer.append("g")
    .selectAll("path")
    .data(features)
    .join("path")
    .attr("d", path)
    .attr("class", f => rowFor(f) ? "country" : "country nodata")
    .attr("fill", f => { const d = rowFor(f); return d ? color(d.score) : null; }));

  // Countries too small to tap get a dot on their main island, with a bigger invisible tap area.
  const SMALL_AREA = 6;
  const largest = new Map();
  for (const f of features) {
    const d = rowFor(f);
    if (!d) continue;
    const a = path.area(f), cur = largest.get(d.code);
    if (!cur || a > cur.a) largest.set(d.code, { f, a });
  }
  function mainCentroid(f) {
    if (f.geometry.type !== "MultiPolygon") return path.centroid(f);
    let best = null, bestArea = -1;
    for (const coordinates of f.geometry.coordinates) {
      const poly = { type: "Polygon", coordinates };
      const a = path.area(poly);
      if (a > bestArea) { bestArea = a; best = poly; }
    }
    return path.centroid(best);
  }
  // Which other country (with data) is under a map point? Canvas hit-testing is fast enough for this.
  const hitCtx = document.createElement("canvas").getContext("2d");
  const shapes = [...largest.values()].map(({ f, a }) => ({ code: rowFor(f).code, a, b: path.bounds(f), p: new Path2D(path(f)) }));
  function landAt([x, y], exceptCode) {
    return shapes.find(s => s.code !== exceptCode && x >= s.b[0][0] && x <= s.b[1][0] && y >= s.b[0][1] && y <= s.b[1][1]
      && hitCtx.isPointInPath(s.p, x, y)) || null;
  }
  // Dots sitting on or next to another country are drawn smaller, with a tight tap area.
  const SEA_MARK = 3, LAND_HITS = [2.5, 1.8];
  const ring = (at, r) => d3.range(12).map(k => [at[0] + r * Math.cos(k * Math.PI / 6), at[1] + r * Math.sin(k * Math.PI / 6)]);

  const small = [...largest.values()]
    .filter(x => x.a < SMALL_AREA)
    .map(x => ({ f: x.f, code: rowFor(x.f).code, at: mainCentroid(x.f) }))
    .filter(x => x.at.every(Number.isFinite))
    // A dot may hide at most a quarter of a neighbour that has no dot of its own: shrink it
    // until it fits, or leave it out (Palestine's dot would cover Israel).
    .map(x => ({ ...x, landHit: LAND_HITS.find(r => {
      const covered = new Map();
      for (let dx = -r; dx <= r; dx += 0.25) for (let dy = -r; dy <= r; dy += 0.25) {
        if (dx * dx + dy * dy > r * r) continue;
        const s = landAt([x.at[0] + dx, x.at[1] + dy], x.code);
        if (s && s.a >= SMALL_AREA) covered.set(s, (covered.get(s) || 0) + 0.0625);
      }
      return [...covered].every(([s, area]) => area / s.a < 0.25);
    }) }))
    .filter(x => x.landHit);
  for (const s of small) s.base = s.at.slice();

  // Nudge clustered dots (Caribbean, Hong Kong/Macao) apart so each one can be tapped.
  const MIN_GAP = 7;
  for (let pass = 0; pass < 60; pass++) {
    for (let i = 0; i < small.length; i++) {
      for (let j = i + 1; j < small.length; j++) {
        const a = small[i].at, b = small[j].at;
        const dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy);
        if (d >= MIN_GAP) continue;
        const push = (MIN_GAP - d) / 2;
        const ux = d ? dx / d : Math.cos(i), uy = d ? dy / d : Math.sin(i);
        a[0] -= ux * push; a[1] -= uy * push;
        b[0] += ux * push; b[1] += uy * push;
      }
    }
  }

  const dots = layer.append("g")
    .selectAll("g")
    .data(small.map(x => x.f))
    .join("g")
    .attr("class", "dot");
  // Tap area up to 8 units, but never reaching into a neighbouring dot's area,
  // and shrunk where it would take taps from a neighbouring country.
  const onLand = small.map(a => ring(a.at, 3.5).some(p => landAt(p, a.code)));
  const hitRadius = small.map((a, i) => {
    let r = small.reduce((r, b, j) =>
      i === j ? r : Math.min(r, Math.hypot(a.at[0] - b.at[0], a.at[1] - b.at[1]) / 2), 8);
    if (onLand[i]) return Math.min(r, a.landHit);
    while (r > 3.5 && ring(a.at, r).some(p => landAt(p, a.code))) r = Math.max(3.5, r - 1);
    return r;
  });
  dots.append("circle").attr("class", "hit").attr("r", (f, i) => hitRadius[i]);
  dots.append("circle").attr("class", "mark").attr("r", (f, i) => onLand[i] ? small[i].landHit - 0.5 : SEA_MARK)
    .attr("fill", f => color(rowFor(f).score));
  interactive(dots);

  // Zoom the map itself, far past the browser's own page zoom: pinch, trackpad pinch or
  // ctrl+scroll, drag to pan once zoomed, and +/−/reset buttons. Dots keep their on-screen
  // size, and their nudges fade out as the real islands spread apart.
  let k = 1;
  function placeDots() {
    dots.attr("transform", (f, i) => {
      const { at, base } = small[i];
      return `translate(${base[0] + (at[0] - base[0]) / k},${base[1] + (at[1] - base[1]) / k}) scale(${1 / k})`;
    });
  }
  placeDots();

  const MAX_ZOOM = 40;
  const zoom = d3.zoom()
    .scaleExtent([1, MAX_ZOOM])
    .extent([[0, 0], [width, height]])
    .translateExtent([[0, 0], [width, height]])
    .filter(event => {
      if (event.type === "wheel") return event.ctrlKey; // plain scrolling still scrolls the page
      if (event.type === "touchstart") return event.touches.length > 1 || k > 1;
      return !event.button;
    })
    .on("zoom", event => {
      const t = event.transform;
      if (t.k !== k) { k = t.k; placeDots(); }
      layer.attr("transform", t);
      mapEl.classList.toggle("zoomed", k > 1);
      zoomOut.property("disabled", k <= 1);
      zoomIn.property("disabled", k >= MAX_ZOOM);
      reset.property("disabled", k <= 1);
      hide(); // the box's anchor point has moved
    });
  svg.call(zoom);

  const controls = d3.select(mapEl).append("div").attr("class", "zoom-controls");
  const button = (label, title, fn) => controls.append("button")
    .attr("type", "button").attr("aria-label", title).attr("title", title).text(label)
    .on("click", event => { event.stopPropagation(); fn(svg.transition().duration(250)); });
  const zoomIn = button("+", "Zoom in", t => zoom.scaleBy(t, 2));
  const zoomOut = button("−", "Zoom out", t => zoom.scaleBy(t, 0.5)).property("disabled", true);
  const reset = button("⟲", "Reset zoom", t => zoom.transform(t, d3.zoomIdentity)).property("disabled", true);

  // iOS reports taps as "mouse" clicks, so remember what the finger/mouse really was.
  document.addEventListener("pointerdown", e => { lastPointer = e.pointerType; }, true);
  document.addEventListener("click", hide);
  // Keep the box attached to the country, at normal size, while the user zooms or pans.
  if (window.visualViewport) {
    for (const type of ["resize", "scroll"]) {
      window.visualViewport.addEventListener(type, () => { if (tip.classList.contains("show")) place(); });
    }
  }
})();
</script>
</body>
</html>
