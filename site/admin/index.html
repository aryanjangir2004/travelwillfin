<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Finndex editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f4;
    --card: #ffffff;
    --text: #181818;
    --muted: #6b6b6b;
    --border: #e2e2e0;
    --accent: #2166ac;
    --accent-text: #ffffff;
    --ok: #1a7f37;
    --err: #b2182b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font-family: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; -webkit-text-size-adjust: 100%; }
  header { padding: 16px 16px 8px; max-width: 720px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0; }
  .who { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-top: 4px; font-size: 14px; color: var(--muted); }
  .who a { color: var(--accent); text-decoration: none; white-space: nowrap; }
  .controls {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: 8px 16px 10px; max-width: 720px; margin: 0 auto;
    display: grid; grid-template-columns: 1fr auto; gap: 8px;
  }
  input[type=search], select, textarea, input[type=number] {
    font: inherit; color: var(--text); background: var(--card);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; width: 100%;
  }
  select { width: auto; }
  main { max-width: 720px; margin: 0 auto; padding: 0 16px 48px; }
  .count { font-size: 13px; color: var(--muted); margin: 2px 2px 8px; }
  .row { background: var(--card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 8px; overflow: hidden; }
  .row > button.head {
    all: unset; box-sizing: border-box; width: 100%; cursor: pointer;
    display: grid; grid-template-columns: 14px 1fr auto; align-items: center; gap: 10px; padding: 12px 14px;
  }
  .row > button.head:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 12px; }
  .swatch { width: 14px; height: 14px; border-radius: 4px; }
  .name { font-weight: 500; }
  .snippet { grid-column: 2 / 4; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: -4px; }
  .badge { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 2.5ch; text-align: right; }
  .edit { padding: 4px 14px 14px; border-top: 1px solid var(--border); }
  .edit label { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin: 12px 0 6px; }
  .score-line { display: grid; grid-template-columns: 1fr 84px; gap: 12px; align-items: center; }
  input[type=range] { width: 100%; height: 32px; accent-color: var(--accent); }
  input[type=number] { text-align: center; font-weight: 700; }
  textarea { min-height: 96px; resize: vertical; line-height: 1.4; }
  .chars { font-size: 12px; color: var(--muted); text-align: right; margin-top: 4px; }
  .chars.over { color: var(--err); }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  .actions button { font: inherit; font-weight: 500; border-radius: 10px; padding: 11px 16px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; }
  .actions button.save { background: var(--accent); border-color: var(--accent); color: var(--accent-text); flex: 1; }
  .actions button:disabled { opacity: .5; cursor: default; }
  .status { font-size: 13px; margin-top: 8px; min-height: 1.2em; }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }
  .last { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .empty, .error { text-align: center; color: var(--muted); padding: 32px 0; }
  .error { color: var(--err); }
</style>
</head>
<body>
<header>
  <h1>Finndex editor</h1>
  <div class="who"><span id="who">Loading…</span><a href="/" target="_blank" rel="noopener">View map ↗</a></div>
</header>
<div class="controls">
  <input type="search" id="q" placeholder="Search countries" autocomplete="off" aria-label="Search countries">
  <select id="sort" aria-label="Sort">
    <option value="name">A–Z</option>
    <option value="low">Lowest</option>
    <option value="high">Highest</option>
    <option value="recent">Recent</option>
  </select>
</div>
<main>
  <div class="count" id="count"></div>
  <div id="list"></div>
</main>

<script src="/vendor/d3.min.js"></script>
<script>
(async function () {
  const MAX_REASON = 500;
  const list = document.getElementById("list");
  const q = document.getElementById("q");
  const sortSel = document.getElementById("sort");
  const count = document.getElementById("count");
  let countries = {}, meta = {}, openKey = null, color;

  const el = (tag, props = {}, ...kids) => {
    const n = Object.assign(document.createElement(tag), props);
    n.append(...kids);
    return n;
  };

  function recolor() {
    const scores = Object.values(countries).map(d => d.score);
    const min = Math.min(...scores), max = Math.max(...scores);
    // Same palette as the public map.
    color = d3.scaleSequential(t => d3.interpolateRdBu(0.08 + t * 0.84)).domain([min, max === min ? min + 1 : max]);
  }

  function when(iso) {
    const d = new Date(iso);
    return d.toLocaleString(undefined, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  }

  function rows() {
    const term = q.value.trim().toLowerCase();
    let keys = Object.keys(countries).filter(k => !term || countries[k].country.toLowerCase().includes(term));
    const by = sortSel.value;
    keys.sort((a, b) => {
      const A = countries[a], B = countries[b];
      if (by === "low") return A.score - B.score || A.country.localeCompare(B.country);
      if (by === "high") return B.score - A.score || A.country.localeCompare(B.country);
      if (by === "recent") return (meta[b]?.at || "").localeCompare(meta[a]?.at || "") || A.country.localeCompare(B.country);
      return A.country.localeCompare(B.country);
    });
    return keys;
  }

  function render() {
    const keys = rows();
    count.textContent = `${keys.length} ${keys.length === 1 ? "country" : "countries"}`;
    list.replaceChildren();
    if (!keys.length) list.append(el("div", { className: "empty", textContent: "No countries match." }));
    for (const k of keys) list.append(rowEl(k));
  }

  function rowEl(key) {
    const d = countries[key];
    const sw = el("span", { className: "swatch" });
    sw.style.background = color(d.score);
    const head = el("button", { className: "head", type: "button" },
      sw,
      el("span", { className: "name", textContent: d.country }),
      el("span", { className: "badge", textContent: d.score }),
      el("span", { className: "snippet", textContent: d.reason || "No reason yet" }));
    head.setAttribute("aria-expanded", openKey === key);
    head.addEventListener("click", () => { openKey = openKey === key ? null : key; render(); if (openKey) focusRow(key); });
    const row = el("div", { className: "row" }, head);
    row.dataset.key = key;
    if (openKey === key) row.append(editor(key));
    return row;
  }

  function focusRow(key) {
    const row = list.querySelector(`[data-key="${CSS.escape(key)}"]`);
    if (row) row.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }

  function editor(key) {
    const d = countries[key];
    const range = el("input", { type: "range", min: 0, max: 100, step: 1, value: d.score });
    range.setAttribute("aria-label", "Finndex score");
    const num = el("input", { type: "number", min: 0, max: 100, step: 1, value: d.score, inputMode: "numeric" });
    num.setAttribute("aria-label", "Finndex score number");
    const reason = el("textarea", { value: d.reason || "", maxLength: MAX_REASON, rows: 4 });
    reason.setAttribute("aria-label", "Reason");
    const chars = el("div", { className: "chars" });
    const status = el("div", { className: "status", role: "status" });
    const save = el("button", { className: "save", type: "button", textContent: "Save" });
    const cancel = el("button", { type: "button", textContent: "Cancel" });

    const sync = () => {
      chars.textContent = `${reason.value.length} / ${MAX_REASON}`;
      chars.classList.toggle("over", reason.value.length > MAX_REASON);
    };
    range.addEventListener("input", () => { num.value = range.value; });
    num.addEventListener("input", () => { if (num.value !== "") range.value = num.value; });
    reason.addEventListener("input", sync);
    sync();

    cancel.addEventListener("click", () => { openKey = null; render(); });
    save.addEventListener("click", async () => {
      const score = Number(num.value);
      if (!Number.isInteger(score) || score < 0 || score > 100) {
        status.className = "status err"; status.textContent = "Score must be a whole number from 0 to 100.";
        return;
      }
      save.disabled = cancel.disabled = true;
      status.className = "status"; status.textContent = "Saving…";
      try {
        const res = await fetch(`/api/countries/${encodeURIComponent(key)}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json", "X-Finndex": "1" },
          body: JSON.stringify({ score, reason: reason.value }),
        });
        const out = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(out.error || `Save failed (${res.status})`);
        countries[key] = out.country;
        meta[key] = out.meta;
        recolor();
        openKey = null;
        render();
        flash(key);
      } catch (e) {
        status.className = "status err"; status.textContent = e.message;
        save.disabled = cancel.disabled = false;
      }
    });

    const m = meta[key];
    return el("div", { className: "edit" },
      el("label", { textContent: "Finndex score (0 = never, 100 = dream trip)" }),
      el("div", { className: "score-line" }, range, num),
      el("label", { textContent: "Reason" }),
      reason, chars,
      el("div", { className: "actions" }, cancel, save),
      status,
      m ? el("div", { className: "last", textContent: `Last changed by ${m.by}, ${when(m.at)}` }) : "");
  }

  function flash(key) {
    const row = list.querySelector(`[data-key="${CSS.escape(key)}"]`);
    if (!row) return;
    const note = el("div", { className: "status ok", textContent: "Saved. The map shows it now." });
    note.style.padding = "0 14px 10px";
    row.append(note);
    setTimeout(() => note.remove(), 3000);
  }

  q.addEventListener("input", () => { openKey = null; render(); });
  sortSel.addEventListener("change", () => { openKey = null; render(); });

  try {
    const res = await fetch("/api/countries", { cache: "no-store" });
    if (!res.ok) throw new Error(res.status === 401 ? "You're not signed in." : `Could not load (${res.status}).`);
    const out = await res.json();
    countries = out.countries; meta = out.meta || {};
    document.getElementById("who").textContent = `Signed in as ${out.user}`;
    recolor();
    render();
  } catch (e) {
    document.getElementById("who").textContent = "";
    list.replaceChildren(el("div", { className: "error", textContent: e.message }));
  }
})();
</script>
</body>
</html>
